<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Herdr · Live Map</title>
<style>
  :root {
    --bg:#0b0b0d; --bg-2:#131318; --panel:rgba(255,255,255,.028);
    --panel-2:rgba(255,255,255,.045);
    --line:rgba(198,168,110,.16); --line-soft:rgba(255,255,255,.06);
    /* --faint is the quietest tier that is still READABLE: 4.6:1 on --bg. Anything fainter
       (the old #5c584f measured 2.78:1) is decoration pretending to be a sentence. */
    --gold:#c6a86e; --gold-bright:#e6d3a6; --ink:#efe9dd; --muted:#8b8578; --faint:#7d7a70;
    --working:#e0ad46; --blocked:#e07a54; --done:#9bbd84; --idle:#7d786c; --unknown:#494540;
    --shadow:0 24px 60px -20px rgba(0,0,0,.75);
    --step-w:290px;
  }
  * { box-sizing:border-box; }
  /* A section given `hidden` must actually be gone. Several of them are flex containers, and
     a class saying display:flex quietly beats the browser's own rule for hidden. */
  [hidden] { display:none !important; }
  /* If this machine is set to reduce motion, nothing here moves — one rule for the whole page,
     so a new animation can never quietly opt out of it. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
  }
  html,body { margin:0; height:100%; }
  body {
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(198,168,110,.10), transparent 60%),
      radial-gradient(900px 600px at 0% 110%, rgba(198,168,110,.05), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; letter-spacing:.01em;
    min-height:100%;
  }
  .display { font-family:'Cormorant Garamond','Didot','Playfair Display',Georgia,serif; }

  header {
    display:flex; align-items:baseline; justify-content:space-between; gap:1.5rem;
    padding:2.4rem clamp(1.2rem,4vw,3.4rem) 1.4rem;
    border-bottom:1px solid var(--line);
  }
  .brand { display:flex; align-items:baseline; gap:1rem; }
  .brand h1 {
    font-family:'Cormorant Garamond','Didot',Georgia,serif;
    font-weight:500; font-size:clamp(2rem,4.5vw,3rem); margin:0;
    letter-spacing:.22em; text-transform:uppercase;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand small { color:var(--muted); letter-spacing:.32em; text-transform:uppercase; font-size:.62rem; }
  .head-right { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; justify-content:flex-end; }
  .head-right .btn { white-space:nowrap; }
  @media (max-width:900px) {
    header { flex-wrap:wrap; gap:.8rem; padding-top:1.4rem; }
    .head-right { gap:.5rem; }
  }
  .live { display:flex; align-items:center; gap:.55rem; color:var(--muted); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; }
  .dot-live { width:8px; height:8px; border-radius:50%; background:var(--done); box-shadow:0 0 0 0 rgba(155,189,132,.6); animation:pulse 2.4s infinite; }
  .live.stale .dot-live { background:var(--blocked); animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(155,189,132,.5)} 70%{box-shadow:0 0 0 9px rgba(155,189,132,0)} 100%{box-shadow:0 0 0 0 rgba(155,189,132,0)} }

  main { padding:1.8rem clamp(1.2rem,4vw,3.4rem) 4rem; max-width:1500px; margin:0 auto; }

  /* How many agents, in one line. Every card below already says its own status in colour,
     so a row of big boxes — several of them reading zero — repeated what was already there. */
  .counts { display:flex; flex-wrap:wrap; align-items:center; gap:.9rem; margin-bottom:1.6rem;
    font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .counts b { font-family:'Cormorant Garamond',Georgia,serif; font-size:1.15rem; letter-spacing:0;
    text-transform:none; color:var(--ink); margin-right:.3rem; }
  .counts span { display:flex; align-items:center; gap:.45rem; }
  .swatch { width:9px; height:9px; border-radius:50%; }

  /* What the lines are for: one job to everyone you joined up. It is a raised surface, not a
     hairline box — this is the only thing on the page that acts on all the agents at once, so
     it should read as sitting above the map rather than beside it. */
  .wired {
    margin:0 0 1.6rem; padding:.9rem 1.1rem; border-radius:14px;
    border:1px solid var(--line); background:var(--panel-2);
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
    display:flex; flex-direction:column; gap:.6rem;
  }
  .wired-sum { margin:0; font-size:.76rem; color:var(--muted); }
  .wired .composer { display:flex; gap:.6rem; align-items:flex-end; }
  .wired textarea {
    flex:1; min-width:0; resize:none; padding:.6rem .75rem; border-radius:10px;
    border:1px solid var(--line-soft); background:var(--bg); color:var(--ink);
    font:inherit; font-size:.86rem; line-height:1.45;
  }
  .wired textarea:focus-visible { outline:1px solid var(--gold); border-color:var(--gold); }

  /* Choosing what a line means, at the spot where you dropped it — never a hidden mode. */
  .kind-menu {
    position:fixed; z-index:40; min-width:190px; padding:.35rem;
    border:1px solid var(--line); border-radius:12px;
    /* Solid, not the translucent panel tint: a menu you can read the page through is unreadable. */
    background:var(--bg-2); box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:.15rem; max-width:320px;
  }
  .kind-menu button {
    text-align:left; padding:.5rem .6rem; border:0; border-radius:8px; cursor:pointer;
    background:none; color:var(--ink); font:inherit; font-size:.85rem;
  }
  .kind-menu button small { display:block; color:var(--faint); font-size:.7rem; line-height:1.35; margin-top:.15rem; }
  .kind-menu button:hover, .kind-menu button:focus-visible { background:rgba(198,168,110,.12); outline:none; }
  .kind-menu .drop { color:var(--blocked); }

  /* Needs-you lane. On a map small enough to take in at once it repeated a card sitting a
     few centimetres below it, so it only appears once there are enough agents to scroll past
     — or once a view is open and the map is only a narrow rail. */
  body:not(.crowded):not(.in-view) .needs { display:none; }
  .needs { margin:0 0 2.2rem; }
  .section-title { font-family:'Cormorant Garamond',Georgia,serif; font-size:1.5rem; font-weight:500; letter-spacing:.02em; margin:0 0 .9rem; color:var(--gold-bright); }
  .needs-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:.8rem; }
  .need {
    border:1px solid var(--line); border-radius:14px; padding:1rem 1.1rem;
    background:linear-gradient(180deg,rgba(224,122,84,.10),rgba(224,122,84,.02));
    display:flex; flex-direction:column; gap:.3rem; box-shadow:var(--shadow);
  }
  .need.done { background:linear-gradient(180deg,rgba(155,189,132,.10),rgba(155,189,132,.02)); border-color:rgba(155,189,132,.28); }
  .need .who { font-size:1rem; }
  .need .meta { font-size:.72rem; color:var(--muted); letter-spacing:.06em; }
  .need .tag { align-self:flex-start; margin-top:.35rem; font-size:.6rem; letter-spacing:.18em; text-transform:uppercase; padding:.25rem .6rem; border-radius:999px; border:1px solid currentColor; }

  /* Map — a grid, so ten one-agent projects fit on a screen instead of ten full rows.
     A workspace with real activity claims two columns; a quiet one stays narrow. */
  .workspaces { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:1.1rem; align-items:start; }
  .ws {
    border:1px solid var(--line-soft); border-radius:18px; overflow:hidden;
    background:linear-gradient(180deg,var(--panel),transparent);
  }
  .ws.busy { grid-column:span 2; }
  @media (max-width:760px) { .ws.busy { grid-column:auto; } }
  .ws-head { display:flex; align-items:center; gap:.7rem; padding:.85rem 1.1rem; border-bottom:1px solid var(--line-soft); }
  .ws-head h3 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:1.25rem; margin:0; letter-spacing:.03em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ws-head .badge { font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); flex:0 0 auto; }
  .ws-head .focus-star { color:var(--gold); font-size:.8rem; }
  .ws-head .btn { margin-left:auto; flex:0 0 auto; white-space:nowrap; }
  .tabs { padding:.6rem 1.1rem 1.1rem; display:flex; flex-direction:column; gap:.9rem; }
  .tab-group { border-left:1px solid var(--line); padding-left:.85rem; }
  .tab-label { font-size:.66rem; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin:.2rem 0 .6rem; }
  .panes { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.6rem; }

  .card {
    position:relative; border:1px solid var(--line-soft); border-radius:13px; padding:.95rem 1rem;
    background:var(--panel); display:flex; flex-direction:column; gap:.5rem;
    transition:border-color .5s ease, box-shadow .5s ease, transform .2s ease;
    animation:rise .4s ease both;
  }
  @keyframes rise { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .card.terminal { opacity:.5; }
  .card.focused { border-color:var(--gold); }
  .card .top { display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
  .card .name { font-size:.94rem; letter-spacing:.01em; }
  .card .since { font-size:.62rem; color:var(--faint); opacity:.6; flex:0 0 auto; font-variant-numeric:tabular-nums; }
  .card .cwd { font-size:.68rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status { display:flex; align-items:center; gap:.45rem; font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .status .swatch { box-shadow:0 0 8px currentColor; }

  .s-working { color:var(--working); } .s-blocked { color:var(--blocked); }
  .s-done { color:var(--done); } .s-idle { color:var(--idle); } .s-unknown { color:var(--unknown); }
  /* A working agent glows; it no longer pulses forever. The glow says the same thing and
     stops competing for your eye with the one card that actually wants you. */
  .card.st-working { box-shadow:0 0 0 1px rgba(224,173,70,.24), 0 0 28px -6px rgba(224,173,70,.5); border-color:rgba(224,173,70,.35); animation:rise .4s ease both; }
  .card.st-blocked { border-color:rgba(224,122,84,.4); box-shadow:0 0 24px -8px rgba(224,122,84,.5); }
  .card.st-done { border-color:rgba(155,189,132,.34); }

  /* States */
  .state { text-align:center; padding:5rem 1.5rem; color:var(--muted); }
  .state .display { font-size:2rem; color:var(--gold-bright); margin-bottom:.6rem; }
  .state p { max-width:34rem; margin:.4rem auto; line-height:1.6; }
  .state .hint { font-size:.85rem; color:var(--faint); }
  .spin { width:34px; height:34px; margin:0 auto 1.4rem; border-radius:50%; border:2px solid var(--line); border-top-color:var(--gold); animation:spin 1s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* Connect agents on the map itself: a dot on each card, dragged to another card.
     Connecting happens here and nowhere else, so there is no second place to keep in step. */
  .card .port {
    position:absolute; right:-7px; top:50%; transform:translateY(-50%); padding:0; z-index:3;
    width:15px; height:15px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
    cursor:crosshair; opacity:0; transition:opacity .18s ease, border-color .18s ease, background .18s ease;
    pointer-events:none;      /* invisible: it must not swallow a click meant for what is under it */
  }
  .card:hover .port, .card:focus-within .port, body.wiring .card .port { opacity:1; pointer-events:auto; }
  .card .port:hover, .card .port:focus-visible { border-color:var(--gold); background:var(--gold); outline:none; }
  body.wiring .card.agent-click:hover { border-color:var(--gold); transform:none; }
  /* The lines live above the cards but must never eat a click meant for one. */
  /* An svg keeps its own 300x150 default size unless it is told otherwise, and anything
     outside that box is clipped away — so the size is set, not just the position. */
  #links { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:6; }
  #links path { fill:none; stroke:var(--gold); stroke-width:1.6; opacity:.7; }
  #links .ghost path { stroke-dasharray:5 4; opacity:.95; }
  #links text {
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; fill:var(--muted);
    pointer-events:auto; cursor:pointer; paint-order:stroke; stroke:var(--bg); stroke-width:4px;
  }
  #links text:hover, #links text:focus-visible { fill:var(--gold-bright); outline:none; }
  #links text:focus-visible { text-decoration:underline; }
  #links .x { fill:var(--faint); }
  #links .x:hover { fill:var(--blocked); }

  /* Overlays: agent detail + workflows */
  .card.agent-click { cursor:pointer; }
  .card.agent-click:hover { transform:translateY(-2px); border-color:var(--gold); }
  .need { cursor:pointer; transition:transform .2s ease; }
  .need:hover { transform:translateY(-2px); }
  .overlay {
    position:fixed; inset:0; background:rgba(5,5,7,.72); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:1rem; z-index:50;
    animation:rise .25s ease both;
  }
  .sheet {
    /* Panels are wide; the agent viewer overrides --sheet-w to fit its own text. */
    width:var(--sheet-w,min(1500px,96vw)); max-width:min(1500px,96vw);
    max-height:94vh; display:flex; flex-direction:column; gap:.85rem;
    border:1px solid var(--line); border-radius:18px; padding:1.2rem 1.3rem;
    background:linear-gradient(180deg,#17171c,#101014); box-shadow:var(--shadow);
  }
  /* A view, not a popup. Connections and Workflows each own a URL, so they get the
     whole window under the header instead of floating on a dimmed copy of the map. The
     agent viewer keeps the old floating treatment — it is a look, not a place. */
  .overlay.as-view {
    position:static; inset:auto; padding:0; background:none; backdrop-filter:none;
    display:block; animation:none;
  }
  .overlay.as-view .sheet {
    width:100%; max-width:none; max-height:none; min-height:calc(100vh - 190px);
    border:0; border-radius:0; background:none; box-shadow:none; padding:0;
  }
  /* While a view is open the map does not vanish — it narrows to a rail down the left, so you
     can still see who is working and who is stuck while you work. "Hide map" collapses
     the rail and the view takes the whole window; that choice is remembered. */
  body.in-view main {
    display:grid; grid-template-columns:262px 1fr; column-gap:1.5rem; align-items:start;
  }
  body.in-view main > * { grid-column:1; }
  body.in-view #view-slot { grid-column:2; grid-row:1 / -1; min-width:0; }
  body.in-view main > .counts,
  body.in-view main > .teams-strip,
  body.in-view main > .wired,
  body.in-view main > .legend,
  body.in-view main > #state { display:none; }
  body.in-view .needs { margin-bottom:1rem; }
  body.in-view .needs .section-title { font-size:1rem; margin-bottom:.5rem; }
  body.in-view .need { padding:.55rem .7rem; gap:.15rem; }
  body.in-view .need .who { font-size:.85rem; }
  body.in-view .needs-cards, body.in-view .workspaces, body.in-view .panes { grid-template-columns:1fr; }
  body.in-view .workspaces { gap:.6rem; }
  body.in-view .ws.busy { grid-column:auto; }
  body.in-view .ws-head { padding:.6rem .8rem; }
  body.in-view .ws-head h3 { font-size:1rem; }
  body.in-view .tabs { padding:.4rem .8rem .8rem; gap:.5rem; }
  body.in-view .card { padding:.55rem .7rem; gap:.3rem; animation:none; }
  body.in-view .card .cwd { display:none; }
  body.in-view .card .name { font-size:.82rem; }
  /* Collapsed: the view gets the whole window, exactly as it did before the rail existed. */
  body.in-view.rail-off main { grid-template-columns:1fr; }
  body.in-view.rail-off #view-slot { grid-column:1; }
  body.in-view.rail-off main > :not(#view-slot) { display:none; }
  /* A narrow window has no room for both — the view wins, the rail steps aside. */
  @media (max-width:980px) {
    body.in-view main { grid-template-columns:1fr; }
    body.in-view #view-slot { grid-column:1; }
    body.in-view main > :not(#view-slot) { display:none; }
  }
  .view-head { display:flex; align-items:center; gap:.8rem; margin-bottom:1rem; }
  .view-head .back {
    font:inherit; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); background:transparent; border:1px solid var(--line);
    border-radius:999px; padding:.45rem .95rem; cursor:pointer; text-decoration:none;
  }
  .view-head .back:hover { border-color:var(--gold); color:var(--gold-bright); }
  /* The rail toggle resizes the view, it does not leave it — so it must not look like Back. */
  .view-head .rail-toggle { border-style:dashed; margin-left:auto; }
  /* Keyboard users get the same "you are here" the mouse gets. */
  .btn:focus-visible, .back:focus-visible, .rail-btn:focus-visible, .rail-toggle:focus-visible,
  .card.agent-click:focus-visible, .need:focus-visible {
    outline:1px solid var(--gold); outline-offset:2px;
  }
  header a.btn { text-decoration:none; }
  header .btn.on { border-color:var(--gold); color:var(--gold-bright); background:rgba(198,168,110,.12); }
  /* In a view the back link is the way out, so the panel's own Close would be a second
     control doing the same thing under a different word. */
  .overlay.as-view [data-act="close"] { display:none; }

  .sheet-head { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .sheet-head h3 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:1.5rem; margin:0; }
  .sheet-head .actions { display:flex; align-items:center; gap:.5rem; }
  .btn {
    font:inherit; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--gold-bright); background:transparent; border:1px solid var(--line);
    border-radius:999px; padding:.45rem .95rem; cursor:pointer;
  }
  .btn:hover { border-color:var(--gold); }
  .btn.primary { background:linear-gradient(180deg,rgba(198,168,110,.22),rgba(198,168,110,.08)); }
  .btn.on { border-color:var(--gold); color:var(--gold-bright); }
  .btn.wide { width:100%; }
  .btn:disabled { opacity:.35; cursor:default; }

  /* One view: the agent's own words, re-wrapped to this panel so they fill it and never
     scroll sideways. `pre-wrap` keeps the agent's indentation; `anywhere` catches long paths. */
  .screen {
    flex:1; min-height:min(58vh,540px); overflow-y:auto; overflow-x:hidden;
    white-space:pre-wrap; overflow-wrap:anywhere;
    font-family:'Cascadia Mono','Consolas',monospace; font-size:.84rem; line-height:1.7;
    color:#d8d2c4; background:#0a0a0c; border:1px solid var(--line-soft); border-radius:12px;
    padding:1.2rem 1.4rem;
    /* The agent picks its own colours; this panel only takes the edge off them so a
       terminal palette does not glare out of a calm page. */
    --tone:saturate(.6) brightness(1.04);
  }
  .screen .b { font-weight:700; color:#f0e9d8; }
  .screen .d { opacity:.62; }
  .screen .hl { background:rgba(198,168,110,.12); border-radius:3px; padding:.05em .15em; }
  .screen [style*="color"] { filter:var(--tone); }

  /* Reader = the block log: one full-width strip per turn or tool call, in the order they
     happened, Warp's block model. Talk (you/say/notes) always shows; tool calls are a
     visually distinct strip that the "Tools" switch can hide outright. */
  .screen.reader {
    white-space:normal; overflow-wrap:break-word;
    font-family:'Inter',system-ui,sans-serif; font-size:.94rem; line-height:1.6;
    padding:.6rem 0;
  }
  .screen.reader .blk { padding:.5rem 1.4rem; margin:0; }
  .screen.reader .blk p, .screen.reader .blk pre { margin:0; }
  .screen.reader .blk.item { padding-left:2.5rem; text-indent:-1.1rem; }
  /* Your own turns are the landmarks you scroll to find. */
  .screen.reader .blk.you {
    border-left:2px solid var(--gold); margin:.6rem 1.4rem 0 0; padding-left:1.25rem;
    color:#efe7d6;
  }
  /* A tool call: a full-width strip, quieter than talk, easy to scan past or hide. */
  .screen.reader .blk.tool {
    font-family:'Cascadia Mono','Consolas',monospace; font-size:.74rem; line-height:1.55;
    background:rgba(255,255,255,.02); border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
    opacity:.62; margin-top:-1px;
  }
  .screen.reader .blk.tool pre { white-space:pre-wrap; overflow-wrap:anywhere; }
  .screen.reader .blk-tag { font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-bottom:.25rem; }
  .screen.reader.hide-tools .blk.tool, .screen.reader.hide-tools .tool-run { display:none; }
  /* A run of tool calls folds to one line — the count is the whole story until opened. */
  .screen.reader .tool-run > summary {
    cursor:pointer; list-style:none; padding:.35rem 1.4rem; font-size:.66rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
    border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
  }
  .screen.reader .tool-run > summary::before { content:'▸ '; }
  .screen.reader .tool-run[open] > summary::before { content:'▾ '; }
  .screen.reader .tool-run > summary:hover { color:var(--muted); }
  /* A menu the agent is waiting on: every option is clickable, so a choice is one click
     instead of counting arrow presses. Only the live menu at the end lights up. */
  .screen.reader .blk.choice {
    cursor:pointer; border-left:2px solid var(--line); margin-right:1.4rem;
    border-radius:0 10px 10px 0; transition:border-color .2s ease, background .2s ease;
  }
  .screen.reader .blk.choice:hover, .screen.reader .blk.choice:focus-visible {
    border-left-color:var(--gold); background:rgba(198,168,110,.09); outline:none;
  }
  .screen.reader .blk.choice::after {
    content:'click to choose'; display:block; font-size:.6rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint); margin-top:.3rem; opacity:0;
  }
  .screen.reader .blk.choice:hover::after { opacity:.8; }

  /* Jump chips — one per message you sent, so an old exchange is one click away. */
  .turns { display:flex; flex-wrap:wrap; gap:.35rem; margin:.3rem 0 .1rem; }
  .turns:empty { display:none; }
  .turns button {
    font:inherit; font-size:.66rem; color:var(--muted); background:transparent;
    border:1px solid var(--line); border-radius:999px; padding:.2rem .6rem; cursor:pointer;
    max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .turns button:hover { border-color:var(--gold); color:var(--gold-bright); }
  .screen.reader h4 {
    font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:1.25rem;
    color:var(--gold-bright); margin:1.2rem 1.4rem .2rem;
  }

  /* View switch — remembered, so it opens the way you left it. */
  .seg { display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .seg button {
    font:inherit; font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--faint); background:transparent; border:0; padding:.42rem .85rem; cursor:pointer;
  }
  .seg button.on { color:var(--gold-bright); background:rgba(198,168,110,.14); }

  .composer { display:flex; gap:.6rem; align-items:flex-end; position:relative; }
  .composer textarea {
    flex:1; font:inherit; font-size:.9rem; color:var(--ink); background:#0a0a0c; resize:none;
    border:1px solid var(--line-soft); border-radius:10px; padding:.6rem .8rem; outline:none;
    line-height:1.5; max-height:200px; overflow:auto;
  }
  .composer textarea:focus { border-color:var(--gold); }
  .sheet .hintline { font-size:.68rem; color:var(--faint); letter-spacing:.05em; }

  /* Slash-command palette */
  .palette {
    position:absolute; bottom:calc(100% + .4rem); left:0; width:min(560px,100%); max-height:260px; overflow:auto;
    background:#141419; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); z-index:5; padding:.3rem;
  }
  .palette-item {
    display:grid; grid-template-columns:auto 1fr auto; gap:.7rem; align-items:baseline; width:100%; text-align:left;
    font:inherit; background:transparent; border:0; color:var(--ink); padding:.5rem .6rem; border-radius:8px; cursor:pointer;
  }
  .palette-item.on { background:rgba(198,168,110,.14); }
  .palette-item .pname { font-family:'Cascadia Mono',monospace; font-size:.8rem; color:var(--gold-bright); }
  .palette-item .pdesc { font-size:.75rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .palette-item .pkind { font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }

  /* Workflow manager */
  .flows-body { display:grid; grid-template-columns:250px minmax(0,1fr); gap:1.1rem; min-height:0; flex:1; }
  .flow-rail { display:flex; flex-direction:column; gap:.6rem; border-right:1px solid var(--line-soft); padding-right:1rem; overflow:auto; scrollbar-width:thin; }
  /* A fade at the bottom edge is the only cue that the rail has more below it. */
  .flow-rail { -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 24px),transparent); mask-image:linear-gradient(180deg,#000 calc(100% - 24px),transparent); }
  .flow-list { display:flex; flex-direction:column; gap:.4rem; }
  .flow-pick {
    display:flex; flex-direction:column; gap:.2rem; text-align:left; font:inherit; cursor:pointer;
    background:var(--panel); border:1px solid var(--line-soft); border-radius:10px; padding:.6rem .75rem; color:var(--ink);
  }
  .flow-pick.on { border-color:var(--gold); }
  .flow-pick small { font-size:.66rem; color:var(--faint); letter-spacing:.1em; text-transform:uppercase; }
  .flow-pick.preset small { text-transform:none; letter-spacing:.01em; line-height:1.45; }
  .rail-k { font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:.6rem 0 .1rem; }
  .explainer { margin:0; font-size:.82rem; line-height:1.6; color:var(--muted); max-width:80ch; }
  .explainer b { color:var(--gold-bright); font-weight:500; }
  .muted-note { color:var(--faint); font-size:.78rem; line-height:1.6; }
  .flow-edit { display:flex; flex-direction:column; gap:.9rem; min-width:0; }
  .chain { display:flex; gap:.5rem; align-items:stretch; overflow-x:auto; padding-bottom:.5rem; flex:1; }
  .link { align-self:center; color:var(--faint); font-size:1.1rem; flex:0 0 auto; }
  .step {
    flex:0 0 var(--step-w); width:var(--step-w); display:flex; flex-direction:column; gap:.55rem;
    border:1px solid var(--line-soft); border-radius:14px; padding:.8rem .85rem; background:var(--panel);
  }
  .step.st-running, .step.st-waiting { border-color:rgba(224,173,70,.45); }
  .step.st-done { border-color:rgba(155,189,132,.4); }
  .step.st-blocked, .step.st-failed { border-color:rgba(224,122,84,.5); }
  .step.st-unsure { border-color:rgba(224,173,70,.55); }
  .step-top { display:flex; align-items:center; gap:.5rem; }
  .step-n { font-family:'Cormorant Garamond',Georgia,serif; font-size:1.2rem; color:var(--gold-bright); }
  .step-state { font-size:.62rem; letter-spacing:.06em; color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .step-state.s-done { color:var(--done); } .step-state.s-blocked, .step-state.s-failed { color:var(--blocked); }
  .step-state.s-running, .step-state.s-waiting, .step-state.s-unsure { color:var(--working); }
  .step-tools { display:flex; gap:.2rem; margin-left:auto; }
  .icon { font:inherit; font-size:.75rem; background:transparent; border:1px solid var(--line-soft); border-radius:7px; color:var(--muted); cursor:pointer; padding:.15rem .4rem; }
  .icon:hover:not(:disabled) { color:var(--gold-bright); border-color:var(--gold); }
  .icon:disabled { opacity:.3; cursor:default; }
  .fld { display:flex; flex-direction:column; gap:.25rem; position:relative; }
  .fld > span { font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .fld input, .fld select, .fld textarea {
    font:inherit; font-size:.82rem; color:var(--ink); background:#0a0a0c; resize:none;
    border:1px solid var(--line-soft); border-radius:8px; padding:.45rem .55rem; outline:none; width:100%;
  }
  .fld input:focus, .fld select:focus, .fld textarea:focus { border-color:var(--gold); }
  .spawn { display:flex; flex-direction:column; gap:.45rem; border-left:2px solid var(--line); padding-left:.6rem; }
  .check { display:flex; align-items:center; gap:.45rem; font-size:.72rem; color:var(--muted); }
  .add-step {
    flex:0 0 150px; align-self:center; font:inherit; font-size:.72rem; color:var(--gold-bright); cursor:pointer;
    background:transparent; border:1px dashed var(--line); border-radius:14px; padding:1.4rem .8rem;
  }
  .flow-foot { display:flex; align-items:center; gap:.6rem; }
  .flow-msg { font-size:.74rem; color:var(--muted); }
  .flow-msg.bad { color:var(--blocked); }
  .run-line { font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

  /* Saved teams, one click from the map */
  .teams-strip { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin:-1rem 0 2rem; }
  .teams-strip .k { font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-right:.3rem; }
  .chip {
    font:inherit; font-size:.76rem; color:var(--ink); cursor:pointer;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line); border-radius:999px; padding:.4rem .9rem;
    display:inline-flex; align-items:center; gap:.5rem;
  }
  .chip:hover { border-color:var(--gold); color:var(--gold-bright); }
  .chip small { color:var(--faint); font-size:.66rem; }
  .chip.ghost { border-style:dashed; color:var(--muted); }

  .teams-strip.in-sheet { margin:0 0 .2rem; }
  .chip.on { border-color:rgba(224,173,70,.45); }
  .chip.picked { border-color:var(--gold); background:rgba(198,168,110,.16); color:var(--gold-bright); }
  .chip-err { font-size:.72rem; color:var(--blocked); }

  /* Connections panel */
  .team .team-list { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:.4rem; }
  .team-gone, .read-error { margin:0; font-size:.74rem; color:var(--blocked); }
  .kind-rule { font-size:.66rem; color:var(--faint); }
  .team-sum { margin:0; font-size:.8rem; color:var(--gold-bright); line-height:1.5; }
  .kind-pick { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.5rem; }
  .kind {
    font:inherit; text-align:left; cursor:pointer; color:var(--ink);
    background:var(--panel); border:1px solid var(--line-soft); border-radius:12px; padding:.6rem .75rem;
    display:flex; flex-direction:column; gap:.25rem;
  }
  .kind:hover { border-color:var(--gold); }
  .kind.on { border-color:var(--gold); background:rgba(198,168,110,.12); }
  .kind-name { font-size:.86rem; color:var(--gold-bright); }
  .kind-blurb { font-size:.72rem; color:var(--muted); line-height:1.45; }
  .fld.inline { flex:1; min-width:140px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* New-agent dialog */
  .spawn-sheet { width:min(680px,94vw); }
  .folder-list { display:flex; flex-wrap:wrap; gap:.45rem; max-height:38vh; overflow:auto; }
  .flow-rail .tip { margin-top:auto; padding-top:.8rem; border-top:1px solid var(--line-soft); }
  .team-list { display:flex; flex-direction:column; gap:.4rem; max-height:46vh; overflow:auto; }
  .team-row {
    display:flex; align-items:center; gap:.8rem; padding:.55rem .75rem;
    border:1px solid var(--line-soft); border-radius:10px; background:var(--panel);
  }
  .team-row.lead { border-color:var(--gold); }
  .team-row .crown { font-size:.95rem; padding:.1rem .35rem; }
  .team-row.lead .crown { color:var(--gold-bright); border-color:var(--gold); }
  .team-who { display:flex; flex-direction:column; gap:.1rem; flex:1; font-size:.9rem; }
  .team-who small { font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
  .team-row .check { margin-left:auto; }

  .legend { display:flex; flex-wrap:wrap; align-items:center; gap:1.1rem; margin-top:2.4rem; padding-top:1.4rem; border-top:1px solid var(--line-soft); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  /* The only control here, and the only irreversible one on the page: it sits apart, at the
     far end, and says so in colour. */
  .legend .btn.danger { margin-left:auto; color:var(--blocked); border-color:rgba(224,122,84,.3); }
  .legend .btn.danger:hover { border-color:var(--blocked); background:rgba(224,122,84,.1); }
  .legend span { display:flex; align-items:center; gap:.5rem; }
  footer { text-align:center; color:var(--faint); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; padding:1.5rem; }

  @media (max-width:820px) {
    .flows-body { grid-template-columns:1fr; }
    .flow-rail { border-right:0; border-bottom:1px solid var(--line-soft); padding:0 0 .8rem; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1 class="display">Herdr</h1>
      <small>Live Agent Map</small>
    </div>
    <div class="head-right">
      <span class="flow-msg" id="head-msg" role="status" aria-live="polite"></span>
      <button class="btn" id="new-agent" title="Start an agent in a folder (N)">＋ New agent</button>
      <a class="btn" href="#/" data-nav="sessions" title="The map of every agent">Sessions</a>
      <a class="btn" href="#/teams" data-nav="teams" title="Wire agents together (T)">Connect</a>
      <a class="btn" href="#/flows" data-nav="flows" title="Chain agents one after another (W)">Workflows</a>
      <div class="live" id="live"><span class="dot-live"></span><span id="live-text">connecting…</span></div>
    </div>
  </header>

  <main>
    <section class="counts" id="counts" hidden></section>
    <section class="teams-strip" id="teams-strip" aria-label="Saved teams"></section>
    <!-- Appears only once lines exist. Drawing them is the point; this is what they are FOR. -->
    <section class="wired" id="wired" hidden>
      <p class="wired-sum" id="wired-sum"></p>
      <div class="composer">
        <textarea id="wired-task" rows="1" maxlength="4000"
          placeholder="One job for everyone you have connected — each agent is told its own part"></textarea>
        <button class="btn primary" id="wired-send">Send job</button>
        <button class="btn" id="wired-clear" title="Remove every line">Clear lines</button>
      </div>
    </section>
    <section class="needs" id="needs" hidden>
      <h2 class="section-title">Needs you</h2>
      <div class="needs-cards" id="needs-cards"></div>
    </section>
    <div class="workspaces" id="workspaces"></div>
    <div id="state"></div>
    <div id="view-slot"></div>

    <!-- Only the two marks the count line above does not already name. Closing every agent
         at once lives down here, away from the navigation — it is the one thing on this page
         that cannot be undone, so it should not sit a slip away from the navigation. -->
    <div class="legend" id="legend" hidden>
      <span><i class="swatch" style="background:var(--unknown)"></i>Shell · not an agent</span>
      <span><b style="color:var(--gold)">★</b> Focused in Herdr</span>
      <button class="btn danger" id="close-all" hidden>Close all agents</button>
    </div>
  </main>
  <svg id="links" aria-label="Connections drawn between agents">
    <defs>
      <!-- The head is on the "to" end, so a line reads in the direction it was drawn —
           which is the difference between the leader and the one being led. -->
      <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L8,4 L0,8 z" fill="var(--gold)"></path>
      </marker>
    </defs>
    <g id="link-layer"></g>
  </svg>
  <footer>Click any agent to read &amp; answer it · drag the dot on its edge to another agent to connect them · <b>N</b> new agent</footer>

<script type="module">
  import { $, esc, basename, get, post, autoGrow, attachPalette, clean, confirmOnce, onOverlayEscape } from './ui.js';
  import { parseAnsi, toLog, toTerminal, chooseKeys } from './reader.js';
  import { openFlows, setModel, setPoll } from './flows.js';
  import { openTeam, refreshTeam, loadTeams, onTeamsChange, setModel as setTeamModel } from './team.js';
  import { addWire, wires, removeWire, setWireKind, clearWires, kindList, groupCount, sendJob, loadKinds } from './wires.js';
  import { startRouter, linkTo, go } from './router.js';

  const STATUS = {
    working: { label:'Working', cls:'s-working', v:'--working' },
    blocked: { label:'Blocked', cls:'s-blocked', v:'--blocked' },
    done:    { label:'Done',    cls:'s-done',    v:'--done' },
    idle:    { label:'Idle',    cls:'s-idle',    v:'--idle' },
    unknown: { label:'Shell',   cls:'s-unknown', v:'--unknown' },
  };

  let pollMs = 1500;
  try { pollMs = (await (await fetch('/api/config')).json()).pollIntervalMs || 1500; } catch {}
  setPoll(pollMs);

  function setLive(ok, text) {
    $('live').classList.toggle('stale', !ok);
    $('live-text').textContent = text;
  }

  function renderState(html) {
    $('state').innerHTML = html;
    for (const el of ['counts','needs','legend','close-all']) $(el).hidden = true;
    $('workspaces').innerHTML = '';
    drawLinks();
  }

  // How long a pane has held its current status — this app's own observation (first seen
  // here, refreshed every poll), not something Herdr reports. Good enough for a faint hint.
  const sinceByPane = new Map();
  function since(p) {
    const rec = sinceByPane.get(p.id);
    if (!rec || rec.status !== p.status) { sinceByPane.set(p.id, { status: p.status, at: Date.now() }); return 0; }
    return Date.now() - rec.at;
  }
  function ago(ms) {
    const m = Math.floor(ms / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m}m`;
    return `${Math.floor(m / 60)}h`;
  }

  function card(p) {
    const st = STATUS[p.status] || STATUS.unknown;
    const cls = ['card', p.isAgent ? `st-${p.status} agent-click` : 'terminal', p.focused ? 'focused' : ''].join(' ');
    const age = p.isAgent ? since(p) : 0;
    return `<div class="${cls}" title="${esc(p.cwd ?? '')}" ${p.isAgent ? `role="button" tabindex="0" data-pane="${esc(p.id)}" data-label="${esc(p.label)}" data-cwd="${esc(p.cwd ?? '')}"` : ''}>
      <div class="top">
        <span class="name">${p.focused ? '<b title="Focused in Herdr">★</b> ' : ''}${esc(p.label)}</span>
        ${p.isAgent ? `<span class="since">${ago(age)}</span>` : ''}
      </div>
      <div class="status ${st.cls}"><i class="swatch" style="background:var(${st.v})"></i>${st.label}</div>
      ${p.cwd ? `<div class="cwd">${esc(basename(p.cwd))}</div>` : ''}
      ${p.isAgent ? `<button class="port" data-port="${esc(p.id)}" tabindex="-1"
        title="Drag this to another agent to connect them" aria-label="Connect ${esc(p.label)} to another agent"></button>` : ''}
    </div>`;
  }

  /* ── Agent detail: watch the live screen, reply, jump to it in Herdr ── */
  let openPane = null, screenTimer = null, rawText = '';
  const history = [];   // what you have sent this session, newest last
  let historyAt = 0;

  /* The agent's terminal is ~90 columns; the screen is 1600px. Rather than leave half the
     panel empty, the panel takes the width THIS agent's text actually needs. Rounded to 40px
     and only re-applied on a big change, so the 1.5s refresh can never make it twitch. */
  function fitSheet(el, text) {
    const sheet = el.closest('.sheet');
    // The 90th-percentile line, not the longest: one stray 300-char path should not
    // stretch the panel across the screen for the other 500 lines.
    const lens = text.split('\n').map((l) => l.length).filter(Boolean).sort((a, b) => a - b);
    if (!lens.length) return;
    const cols = Math.min(160, Math.max(72, lens[Math.floor(lens.length * 0.9)]));
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
    probe.style.font = getComputedStyle(el).font;
    probe.textContent = '0'.repeat(20);
    el.appendChild(probe);
    const chW = probe.getBoundingClientRect().width / 20;
    probe.remove();
    const want = Math.ceil((cols * chW + 90) / 40) * 40;
    const now = parseInt(sheet.style.getPropertyValue('--sheet-w'), 10) || 0;
    if (Math.abs(want - now) > 80) sheet.style.setProperty('--sheet-w', `${Math.max(860, want)}px`);
  }

  /* Which view the agent screen opens in. Remembered on this machine, so the choice is made
     once; falls back to the reader when storage is unavailable. */
  const VIEW_KEY = 'herdr-map.screen-view';
  const getView = () => { try { return localStorage.getItem(VIEW_KEY) || 'reader'; } catch { return 'reader'; } };
  const setView = (v) => { try { localStorage.setItem(VIEW_KEY, v); } catch { /* private mode */ } };

  // Whether tool calls show in the block log — remembered the same way as the view itself.
  const TOOLS_KEY = 'herdr-map.screen-tools';
  const getTools = () => { try { return localStorage.getItem(TOOLS_KEY) !== 'off'; } catch { return true; } };
  const setTools = (on) => { try { localStorage.setItem(TOOLS_KEY, on ? 'on' : 'off'); } catch { /* private mode */ } };

  function paintScreen() {
    const el = document.querySelector('.screen');
    if (!el) return;
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    const text = clean(rawText);
    const lines = parseAnsi(text);
    const reader = getView() === 'reader';
    el.classList.toggle('reader', reader);
    el.classList.toggle('hide-tools', reader && !getTools());
    // The live repaint every 1.5s must not slam shut a tool group you just opened.
    const wasOpen = [...el.querySelectorAll('.tool-run')].map((d) => d.open);
    el.innerHTML = reader ? toLog(lines) : toTerminal(lines);
    el.querySelectorAll('.tool-run').forEach((d, i) => { if (wasOpen[i]) d.open = true; });

    // One chip per message you sent — click to jump back to that exchange.
    const turnsBar = document.querySelector('.turns');
    if (turnsBar) {
      turnsBar.innerHTML = !reader ? '' : [...el.querySelectorAll('.blk.you')].slice(-12).map((b) =>
        `<button data-jump="${b.dataset.turn}" title="Jump to this message">${esc(b.textContent.trim().slice(0, 40))}</button>`).join('');
    }
    // The block log takes the whole panel width on purpose; the terminal is sized instead
    // to however many columns this particular agent is drawing.
    if (reader) el.closest('.sheet')?.style.setProperty('--sheet-w', 'min(1300px,96vw)');
    else fitSheet(el, lines.map((l) => l.map((r) => r.t).join('')).join('\n'));
    if (atBottom) el.scrollTop = el.scrollHeight;

    // Hiding tool calls must say how many it hid — otherwise a quiet agent and a filtered
    // one look identical.
    const toolsBtn = document.querySelector('[data-act="tools"]');
    if (toolsBtn && reader && !getTools()) {
      const n = el.querySelectorAll('.blk.tool').length;
      toolsBtn.textContent = n ? `Tools: ${n} hidden` : 'Tools: hidden';
    }
  }

  /* One failed poll must not blank the transcript you are reading — keep the last good text
     and put the problem in a banner above it. */
  async function refreshScreen() {
    if (!openPane) return;
    const r = await get(`/api/pane/read?id=${encodeURIComponent(openPane)}&format=ansi`);
    const banner = document.querySelector('.read-error');
    if (!document.querySelector('.screen')) return;
    if (r.ok) {
      rawText = r.text || '(screen is empty)';
      if (banner) banner.hidden = true;
    } else if (banner) {
      banner.hidden = false;
      banner.textContent = `Not reading this agent right now — ${r.error} Still trying.`;
    }
    paintScreen();
  }

  /** Closing throws away whatever you were typing, so ask when there is something to lose. */
  function closeSheet(force = false) {
    const box = document.querySelector('.agent-overlay textarea');
    if (!force && box?.value.trim() && !confirmOnce('Throw away the reply you were typing?')) return false;
    openPane = null;
    clearInterval(screenTimer);
    document.querySelector('.agent-overlay')?.remove();
    return true;
  }

  /** Light up whichever view is active, so the switch always shows where you are. */
  const markView = (ov) => {
    ov.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === getView()));
    const toolsBtn = ov.querySelector('[data-act="tools"]');
    if (toolsBtn) {
      toolsBtn.hidden = getView() !== 'reader';
      toolsBtn.classList.toggle('on', getTools());
      toolsBtn.textContent = getTools() ? 'Tools: shown' : 'Tools: hidden';
    }
  };

  function openSheet(paneId, label, cwd) {
    closeSheet(true);
    openPane = paneId;
    rawText = 'Reading…';
    historyAt = history.length;

    const ov = document.createElement('div');
    ov.className = 'overlay agent-overlay';
    ov.innerHTML = `<div class="sheet">
      <div class="sheet-head">
        <h3 class="display">${esc(label)}</h3>
        <div class="actions">
          <div class="seg" role="group" aria-label="How to show this agent">
            <button data-view="reader" title="One block per turn, sized for reading">Reader</button>
            <button data-view="terminal" title="The screen exactly as the terminal draws it">Terminal</button>
          </div>
          <button class="btn" data-act="tools" title="Show or hide the tool-call blocks — replies always stay">Tools</button>
          <button class="btn" data-act="focus">Open in Herdr</button>
          <button class="btn" data-act="close">Close</button>
        </div>
      </div>
      <div class="teams-strip in-sheet" id="sheet-teams" aria-label="Saved connections"></div>
      <p class="read-error" role="status" aria-live="polite" hidden></p>
      <div class="turns" aria-label="Jump to a message you sent"></div>
      <div class="screen"></div>
      <div class="composer">
        <textarea rows="1" maxlength="4000" placeholder="Reply to this agent — Enter sends, “/” lists commands, ↑ brings back what you sent"></textarea>
        <button class="btn primary" data-act="send">Send</button>
        <button class="btn" data-act="enter" title="Just press Enter — accepts the highlighted option">↵ Enter</button>
        <button class="btn" data-act="key-up" title="Move up the agent's menu">↑</button>
        <button class="btn" data-act="key-down" title="Move down the agent's menu">↓</button>
        <button class="btn" data-act="key-escape" title="Press Esc in the agent — stops what it is doing">Esc</button>
        <button class="btn" data-act="key-mode" title="Press Shift+Tab in the agent — switches its working mode">Mode ⇧⇥</button>
      </div>
      <div class="hintline">This is the agent's own screen, live. Claude's slash commands work here — type “/model sonnet” and send. “↵ Enter” accepts a highlighted menu choice.</div>
    </div>`;
    document.body.appendChild(ov);

    ov.querySelector('#sheet-teams').innerHTML = $('teams-strip').innerHTML;
    const box = ov.querySelector('textarea');
    const palette = attachPalette(box, () => cwd || null);

    /** Send a run of keys to this agent; a failure is a banner, never a lost transcript. */
    const pressKeys = async (keys, ov) => {
      const r = await post('/api/pane/keys', { id: paneId, keys });
      const banner = ov.querySelector('.read-error');
      if (!r.ok && banner) { banner.hidden = false; banner.textContent = `That did not land — ${r.error}`; }
      setTimeout(refreshScreen, 400);
    };

    const sendText = async (text) => {
      if (text.trim()) { history.push(text); historyAt = history.length; }
      box.value = '';
      autoGrow(box);
      const r = await post('/api/pane/send', { id: paneId, text });
      // A failed send is a banner, same as a failed read — never overwrite the transcript
      // you were reading with the error, or the agent's own words disappear underneath it.
      const banner = ov.querySelector('.read-error');
      if (!r.ok && banner) { banner.hidden = false; banner.textContent = `That reply did not send — ${r.error}`; }
      setTimeout(refreshScreen, 350);
    };

    ov.addEventListener('click', (e) => {
      if (e.target === ov) return closeSheet();
      const chip = e.target.closest('[data-team-chip]');
      if (chip) { if (closeSheet()) go('teams', chip.dataset.teamChip || null); return; }
      const view = e.target.closest('[data-view]')?.dataset.view;
      if (view) { setView(view); markView(ov); paintScreen(); return; }
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'close') closeSheet();
      if (act === 'send') sendText(box.value);
      if (act === 'enter') sendText('');
      if (act === 'tools') { setTools(!getTools()); markView(ov); paintScreen(); }
      if (act === 'focus') post('/api/pane/focus', { id: paneId });
      const KEYS = { 'key-escape': ['escape'], 'key-mode': ['shift+tab'], 'key-up': ['up'], 'key-down': ['down'] };
      // Picking option N walks the menu with its own arrow keys, then presses Enter.
      const opt = e.target.closest('[data-choice]');
      const keys = KEYS[act] || (opt && chooseKeys(+opt.dataset.choice, +opt.dataset.choiceOf));
      if (keys) pressKeys(keys, ov);
      const jump = e.target.closest('[data-jump]');
      if (jump) ov.querySelector(`.blk.you[data-turn="${jump.dataset.jump}"]`)
        ?.scrollIntoView({ block: 'start', behavior: 'smooth' });
    });

    // A menu option is a button, so Enter and Space pick it the same as a click.
    ov.addEventListener('keydown', (e) => {
      const opt = e.target.closest('[data-choice]');
      if (!opt || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      pressKeys(chooseKeys(+opt.dataset.choice, +opt.dataset.choiceOf), ov);
    });

    box.addEventListener('input', () => autoGrow(box));
    box.addEventListener('keydown', (e) => {
      if (palette.isOpen()) return;              // the palette owns the arrows while it is open
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); return sendText(box.value); }
      if (e.key === 'ArrowUp' && box.selectionStart === 0 && historyAt > 0) {
        e.preventDefault();
        box.value = history[--historyAt];
        autoGrow(box);
      } else if (e.key === 'ArrowDown' && box.selectionStart === box.value.length && historyAt < history.length - 1) {
        e.preventDefault();
        box.value = history[++historyAt];
        autoGrow(box);
      }
    });

    markView(ov);
    paintScreen();
    refreshScreen();
    screenTimer = setInterval(refreshScreen, pollMs);
    box.focus();
  }

  // One opener for mouse and keyboard — a card is a button, so Enter and Space work too.
  function openFromCard(e) {
    if (wiring || e.target.closest('[data-port]')) return;   // you are connecting, not reading
    const el = e.target.closest('[data-pane]');
    if (el && !e.target.closest('.overlay')) openSheet(el.dataset.pane, el.dataset.label, el.dataset.cwd);
  }
  document.addEventListener('click', openFromCard);
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-pane]')) {
      e.preventDefault();
      if (wiring) return joinTo(e.target.dataset.pane);
      openFromCard(e);
    }
  });

  /* ── Connect agents on the map, without going anywhere ──
     Every agent card has a dot on its edge. Drag it to another agent — or click it, then
     click the other agent — and a labelled arrow appears between them. That arrow IS a line
     between them, and a small menu asks what the connection means right where you dropped it.
     There is no mode to remember and nowhere else to go: this page is the only place agents
     are connected. Click a line's label to change what it means or remove it. */
  let wiring = null;                       // { from, x, y, dragging }
  // The one place the header speaks. Anything said here about a line is a problem, so it is
  // marked as one — and cleared the same way, or the red would outlive the message.
  const headMsg = (t) => {
    $('head-msg').textContent = t || '';
    $('head-msg').classList.toggle('bad', !!t);
  };
  const cardEl = (id) => document.querySelector(`.card[data-pane="${CSS.escape(id)}"]`);
  const nameOf = (id) => cardEl(id)?.dataset.label ?? id;

  /** Where a line leaves a card: the middle of whichever side faces the other end. */
  function edge(r, to) {
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = to.x - cx, dy = to.y - cy;
    return Math.abs(dx) * r.height > Math.abs(dy) * r.width
      ? { x: cx + Math.sign(dx) * r.width / 2, y: cy }
      : { x: cx, y: cy + Math.sign(dy) * r.height / 2 };
  }

  function drawLinks() {
    const svg = $('link-layer');       // the arrowhead lives in <defs> beside it, so it survives
    if (!svg) return;
    const mid = (r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
    const box = (id) => cardEl(id)?.getBoundingClientRect() ?? null;
    const curve = (a, b) => `M${a.x},${a.y} C${(a.x + b.x) / 2},${a.y} ${(a.x + b.x) / 2},${b.y} ${b.x},${b.y}`;
    const arrow = ' marker-end="url(#head)"';
    const parts = [];

    // A view fills the page and the map is a rail beside it — the cards there are too small
    // to carry lines, so none are drawn until you are back on the map.
    if (!document.body.classList.contains('in-view')) {
      for (const w of wires()) {
        const ra = box(w.from), rb = box(w.to);
        if (!ra || !rb) continue;             // one end is not on screen: draw nothing rather than a lie
        const a = edge(ra, mid(rb)), b = edge(rb, mid(ra));
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 7;
        // Both handles are real buttons: a line drawn with the mouse is still changeable
        // and removable from the keyboard.
        const names = `${nameOf(w.from)} to ${nameOf(w.to)}`;
        parts.push(`<g><path d="${curve(a, b)}"${arrow}/>
          <text x="${mx}" y="${my}" text-anchor="middle" role="button" tabindex="0" data-wire="${w.i}"
            aria-label="${esc(w.label)}: ${esc(names)}. Change or remove this connection"><title>Change or remove this connection</title>${esc(w.label)}</text></g>`);
      }
    }
    const ra = wiring && box(wiring.from);
    if (ra) parts.push(`<g class="ghost"><path d="${curve(edge(ra, wiring), wiring)}"${arrow}/></g>`);
    svg.innerHTML = parts.join('');
    paintWired();
  }

  /** The send bar, which only exists while there is something to send to. */
  function paintWired() {
    const n = wires().length;
    $('wired').hidden = !n || document.body.classList.contains('in-view');
    if (!n) return;
    const g = groupCount();
    $('wired-sum').textContent =
      `${n} connection${n === 1 ? '' : 's'} · ${g} group${g === 1 ? '' : 's'} of agents. `
      + 'Sending gives every group the same job, each agent told its own part.';
  }

  const stopWiring = () => { wiring = null; document.body.classList.remove('wiring'); drawLinks(); };

  /**
   * Finish a connection on the agent under the pointer, or wherever the keyboard is.
   * The kind is asked for at the drop, so a line never quietly means something you did not pick.
   */
  function joinTo(to, at) {
    const from = wiring?.from;
    stopWiring();
    if (!to || !from) return;
    if (from === to) return headMsg('Connect it to a different agent.');
    headMsg('');
    askKind(at, `How should ${nameOf(from)} and ${nameOf(to)} work together?`, (kind) => {
      const r = addWire(from, to, kind);
      if (!r.ok) headMsg(r.error);
      drawLinks();
    });
  }

  /**
   * The little menu that names the three kinds in full words. It is the only place a kind is
   * ever chosen, so there is nothing to remember between one line and the next.
   * @param {{x:number,y:number}} at - where on screen to put it
   * @param {string} title - what the choice is about
   * @param {(kind:string) => void} pick - what to do with the answer
   * @param {() => void} [onDrop] - if given, the menu also offers to remove the line
   */
  function askKind(at, title, pick, onDrop) {
    document.querySelector('.kind-menu')?.remove();
    const kinds = kindList();
    if (!kinds.length) return pick('manages');    // the server has not answered yet: use the safe one
    const m = document.createElement('div');
    m.className = 'kind-menu';
    m.setAttribute('role', 'menu');
    m.setAttribute('aria-label', title);
    m.innerHTML = kinds.map((k) => `<button role="menuitem" data-pick="${esc(k.key)}">${esc(k.label)}<small>${esc(k.blurb)}</small></button>`).join('')
      + (onDrop ? '<button role="menuitem" class="drop" data-pick="">Remove this connection</button>' : '');
    document.body.appendChild(m);
    // Keep it on screen: a menu opened near the right or bottom edge flips back inside.
    const r = m.getBoundingClientRect();
    m.style.left = `${Math.max(8, Math.min(at.x, innerWidth - r.width - 8))}px`;
    m.style.top = `${Math.max(8, Math.min(at.y, innerHeight - r.height - 8))}px`;
    m.querySelector('button').focus();
    const shut = () => { m.remove(); removeEventListener('pointerdown', away, true); };
    const away = (e) => { if (!e.target.closest('.kind-menu')) shut(); };
    setTimeout(() => addEventListener('pointerdown', away, true));
    m.addEventListener('keydown', (e) => { if (e.key === 'Escape') { shut(); headMsg(''); } });
    m.addEventListener('click', (e) => {
      const b = e.target.closest('[data-pick]');
      if (!b) return;
      shut();
      b.dataset.pick ? pick(b.dataset.pick) : onDrop();
    });
  }

  document.addEventListener('pointerdown', (e) => {
    const port = e.target.closest('[data-port]');
    if (!port) return;
    e.preventDefault();
    // A drag and a click are the same gesture here: let go over another agent and it connects,
    // let go where you started and the line stays armed for a second click. Either works.
    wiring = { from: port.dataset.port, x: e.clientX, y: e.clientY, dragging: false };
    document.body.classList.add('wiring');
    port.setPointerCapture(e.pointerId);
    const move = (ev) => {
      if (!wiring) return;
      if (Math.hypot(ev.clientX - wiring.x, ev.clientY - wiring.y) > 4) wiring.dragging = true;
      wiring.x = ev.clientX; wiring.y = ev.clientY;
      drawLinks();
    };
    const up = (ev) => {
      port.removeEventListener('pointermove', move);
      port.removeEventListener('pointerup', up);
      port.removeEventListener('pointercancel', up);
      if (!wiring?.dragging) return;                       // armed — a second click finishes it
      joinTo(document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.card[data-pane]')?.dataset.pane,
        { x: ev.clientX, y: ev.clientY });
    };
    port.addEventListener('pointermove', move);
    port.addEventListener('pointerup', up);
    port.addEventListener('pointercancel', up);
    drawLinks();
  });

  // While a line is armed it follows the pointer, and the next click lands it.
  document.addEventListener('pointermove', (e) => {
    if (!wiring || wiring.dragging) return;
    wiring.x = e.clientX; wiring.y = e.clientY;
    drawLinks();
  });
  document.addEventListener('click', (e) => {
    if (!wiring || e.target.closest('[data-port]')) return;
    // This click was spent finishing (or cancelling) the line — it must not also open a card.
    const to = e.target.closest('.card[data-pane]')?.dataset.pane;
    e.stopPropagation();
    e.preventDefault();
    joinTo(to, { x: e.clientX, y: e.clientY });
  }, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && wiring) stopWiring(); });

  // A line's own label: the same menu, now also offering to remove it.
  const onLink = (e) => {
    const el = e.target.closest('[data-wire]');
    if (!el) return;
    const i = +el.dataset.wire;
    const r = el.getBoundingClientRect();
    askKind({ x: r.left, y: r.bottom + 6 }, 'What does this connection mean?',
      (k) => { setWireKind(i, k); drawLinks(); },
      () => { removeWire(i); drawLinks(); });
  };
  $('links').addEventListener('click', onLink);
  $('links').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    onLink(e);
  });

  /* ── What the lines are for ── */
  $('wired-task').addEventListener('input', (e) => autoGrow(e.target));
  $('wired-clear').addEventListener('click', () => {
    if (!confirmOnce('Remove every line? The agents themselves are not touched.')) return;
    clearWires();
    drawLinks();
  });
  $('wired-send').addEventListener('click', async () => {
    const box = $('wired-task');
    const task = box.value.trim();
    if (!task) return headMsg('Type the job first.');
    const g = groupCount();
    if (!confirmOnce(`Send this job to ${g} connected ${g === 1 ? 'group' : 'groups'} of agents now?`)) return;
    headMsg('Sending…');
    const r = await sendJob(task);
    if (!r.ok) return headMsg(r.error);
    box.value = '';
    autoGrow(box);
    headMsg('');
    $('wired-sum').textContent = `Sent to ${r.sent} agent${r.sent === 1 ? '' : 's'}.`
      + (r.gone ? ` ${r.gone} connected agent${r.gone === 1 ? ' is' : 's are'} no longer running.` : '');
  });

  addEventListener('resize', drawLinks);
  addEventListener('scroll', drawLinks, true);
  loadKinds().then(drawLinks);
  $('new-agent').addEventListener('click', openSpawn);

  /* ── Views: Connections and Workflows each own a URL ──
     The panels themselves are unchanged. They still build an overlay; this lifts that
     overlay out of the floating layer and into the page, which is the whole difference
     between "a popup over the map" and "a place you navigated to". */
  const VIEWS = { teams: (arg) => openTeam(arg), flows: () => openFlows() };
  let at = { view: 'sessions', arg: null };

  /**
   * Leave whatever view is open. Each panel already guards its own unsaved work behind its
   * Close button, so that is what gets pressed — the guard is never bypassed just because
   * you left by the address bar instead. Returns false if the panel refused to close.
   */
  let closingForRoute = false;
  function leaveView() {
    const ov = $('view-slot').querySelector('.overlay');
    if (!ov) return true;
    closingForRoute = true;                          // this close IS the navigation, not a new one
    ov.querySelector('[data-act="close"]')?.click();
    closingForRoute = false;
    if (document.body.contains(ov)) return false;   // the panel asked and you said no
    return true;
  }

  async function showView(name, arg) {
    if (name === at.view && arg === at.arg) return;
    if (!leaveView()) {                              // put the address bar back where it was
      if (window.location.hash !== linkTo(at.view, at.arg)) window.location.hash = linkTo(at.view, at.arg);
      return;
    }
    at = { view: name, arg };
    $('view-slot').innerHTML = '';
    document.body.classList.toggle('in-view', name !== 'sessions');
    document.body.classList.toggle('rail-off', !getRail());
    drawLinks();          // lines belong to the map, not to a view drawn over it
    document.querySelectorAll('header [data-nav]')
      .forEach((a) => a.classList.toggle('on', a.dataset.nav === name));
    if (name === 'sessions') return;

    // Two of the three panels fetch before they draw, so wait for the panel to exist.
    // Note which overlays existed first, so a second navigation racing this one can never
    // hand us a panel some other call built.
    const before = new Set(document.querySelectorAll('body > .overlay'));
    await VIEWS[name](arg);
    const ov = [...document.querySelectorAll('body > .overlay:not(.agent-overlay)')]
      .find((o) => !before.has(o));
    // Navigating again while this one loaded leaves it stranded in the floating layer,
    // where it would silently swallow every click on the page behind it.
    if (at.view !== name) { ov?.remove(); return; }
    if (!ov) return;
    ov.classList.add('as-view');
    $('view-slot').appendChild(ov);
    ov.querySelector('.sheet')?.insertAdjacentHTML('afterbegin',
      `<div class="view-head"><a class="back" href="${linkTo('sessions')}">← Sessions</a>
         <button class="back rail-toggle" data-act="rail" aria-pressed="${getRail()}">${getRail() ? 'Hide map' : 'Show map'}</button></div>`);
  }

  // The map rail beside a view: on by default, remembered, and it never changes the URL —
  // it is how wide the view is, not where you are.
  const RAIL_KEY = 'herdr-map.view-rail';
  const getRail = () => { try { return localStorage.getItem(RAIL_KEY) !== 'off'; } catch { return true; } };
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act="rail"]');
    if (!b) return;
    const on = !getRail();
    try { localStorage.setItem(RAIL_KEY, on ? 'on' : 'off'); } catch {}
    document.body.classList.toggle('rail-off', !on);
    b.textContent = on ? 'Hide map' : 'Show map';
    b.setAttribute('aria-pressed', String(on));
  });

  // A panel's own Close button inside a view means "go back to the map" — the URL must
  // follow, or the address bar would still claim you are in that view.
  $('view-slot').addEventListener('click', (e) => {
    if (!closingForRoute && e.target.closest('[data-act="close"]')) setTimeout(() => go('sessions'), 0);
  });

  startRouter(['sessions', ...Object.keys(VIEWS)], ({ view, arg }) => {
    // A link that means nothing should not leave a lie in the address bar.
    if (view === 'sessions' && window.location.hash && window.location.hash !== linkTo('sessions')) {
      window.location.replace(linkTo('sessions'));
      return;
    }
    showView(view, arg);
  });

  /* ── Saved connections: a chip each, so one you use daily is a single click ── */
  onTeamsChange((teams, error) => {
    $('teams-strip').innerHTML = `<span class="k">Connections</span>`
      + teams.map((t) => `<button class="chip" data-team-chip="${esc(t.id)}">
          ${esc(t.name)} <small>${t.memberIds.length + (t.leaderId ? 1 : 0)}</small></button>`).join('')
      + `<button class="chip ghost" data-team-chip="">＋ Connect agents</button>`
      + (error ? `<span class="chip-err">${esc(error)}</span>` : '');
  });
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-team-chip]');
    if (chip && !e.target.closest('.agent-overlay')) go('teams', chip.dataset.teamChip || null);
  });
  loadTeams();

  /* Keys: T connections, W workflows, N new agent — only when you are not typing.
     The agent viewer is not a blocker: pressing T swaps it for the panel. */
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
    if (document.querySelector('.overlay:not(.agent-overlay)')) return;
    const key = e.key.toLowerCase();
    if (!'twn'.includes(key)) return;
    if (document.querySelector('.agent-overlay') && !closeSheet()) return;
    e.preventDefault();
    if (key === 'n') return openSpawn();
    // The keys are shortcuts to the same links the nav uses — one way to reach a view.
    go({ t: 'teams', w: 'flows' }[key]);
  });

  /* ── Start a new agent: pick a folder, that is the whole dialog ── */
  async function openSpawn() {
    document.querySelector('.spawn-overlay')?.remove();
    const ov = document.createElement('div');
    ov.className = 'overlay spawn-overlay';
    ov.innerHTML = `<div class="sheet spawn-sheet">
      <div class="sheet-head">
        <h3 class="display">New agent</h3>
        <div class="actions">
          <span class="flow-msg spawn-msg" role="status" aria-live="polite"></span>
          <button class="btn" data-act="close">Close</button>
        </div>
      </div>
      <p class="muted-note">Pick the folder it should work in. It opens in Herdr and appears on this map.</p>
      <div class="folder-list">Reading your folders…</div>
      <label class="fld"><span>Or type a full path — checked when you press Start</span>
        <input class="spawn-cwd" placeholder="C:\\Users\\Shaf\\Downloads\\my-project" />
      </label>
      <div class="flow-foot">
        <button class="btn primary" data-act="start" disabled>Start agent</button>
        <span class="muted-note">Runs <code>claude</code> in that folder.</span>
      </div>
    </div>`;
    document.body.appendChild(ov);

    const cwdBox = ov.querySelector('.spawn-cwd');
    const startBtn = ov.querySelector('[data-act="start"]');
    const setCwd = (v) => { cwdBox.value = v; startBtn.disabled = !v.trim(); };
    cwdBox.addEventListener('input', () => setCwd(cwdBox.value));

    const r = await get('/api/projects');
    const list = ov.querySelector('.folder-list');
    list.innerHTML = r.ok && r.projects.length
      ? r.projects.map((p) => `<button class="chip ${p.running ? 'on' : ''}" data-folder="${esc(p.path)}"
          title="${esc(p.path)}">${esc(p.name)}${p.running ? ' <small>running</small>' : ''}</button>`).join('')
      : `<p class="muted-note">${r.ok ? 'No project folders found — type a path below.' : esc(r.error)}</p>`;

    ov.addEventListener('click', async (e) => {
      if (e.target === ov) return ov.remove();
      const folder = e.target.closest('[data-folder]')?.dataset.folder;
      if (folder) {
        setCwd(folder);
        for (const c of ov.querySelectorAll('[data-folder]')) c.classList.toggle('picked', c.dataset.folder === folder);
        return;
      }
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'close') return ov.remove();
      if (act === 'start') {
        const msg = ov.querySelector('.spawn-msg');
        startBtn.disabled = true;
        msg.textContent = 'Starting…';
        const out = await post('/api/agents/start', { cwd: cwdBox.value.trim() });
        msg.classList.toggle('bad', !out.ok);
        msg.textContent = out.ok ? `Started ${out.label}.` : out.error;
        startBtn.disabled = false;
        if (out.ok) { tick(); setTimeout(() => ov.remove(), 900); }
      }
    });
    cwdBox.focus();
  }
  onOverlayEscape('.spawn-overlay', () => document.querySelector('.spawn-overlay')?.remove());
  onOverlayEscape('.agent-overlay', () => closeSheet());

  /* ── Closing agents: whole map from the header, one workspace from its own header ── */
  async function closeAgents(workspaceId, howMany, where) {
    if (!confirm(`Close ${howMany} agent${howMany === 1 ? '' : 's'} in ${where}? Anything unsaved in them is lost.`)) return;
    $('head-msg').textContent = 'Closing…';
    const r = await post('/api/agents/close-all', { workspaceId });
    $('head-msg').classList.toggle('bad', !r.ok);
    $('head-msg').textContent = r.ok
      ? (r.failed ? `Closed ${r.closed} · ${r.failed} would not close` : `Closed ${r.closed}`)
      : r.error;
    setTimeout(() => { $('head-msg').textContent = ''; }, 6000);
    tick();
  }

  $('close-all').addEventListener('click', () => closeAgents(null, lastCounts.total, 'the whole map'));
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-close-ws]');
    if (btn) closeAgents(btn.dataset.closeWs, Number(btn.dataset.n), btn.dataset.label);
  });

  let lastCounts = { total: 0 };

  const agentsIn = (w) => w.tabs.reduce((n, t) => n + t.panes.filter((p) => p.isAgent).length, 0);
  const shellsIn = (w) => w.tabs.reduce((n, t) => n + t.panes.filter((p) => !p.isAgent).length, 0);

  function render(model) {
    $('state').innerHTML = '';
    setModel(model);
    setTeamModel(model);
    refreshTeam();
    const c = lastCounts = model.counts;
    $('close-all').hidden = !c.total;
    $('counts').hidden = false;
    $('legend').hidden = false;
    // A status nobody is in is not news — only the ones with agents in them are shown.
    $('counts').innerHTML = `<b>${c.total} agent${c.total === 1 ? '' : 's'}</b>` + [
      ['Working', c.working, '--working'],
      ['Blocked', c.blocked, '--blocked'],
      ['Done', c.done, '--done'],
      ['Idle', c.idle, '--idle'],
    ].filter(([, n]) => n > 0)
     .map(([k, n, v]) => `<span><i class="swatch" style="background:var(${v})"></i>${n} ${k}</span>`).join('');

    // Above this many agents the map no longer fits on one screen, so the "needs you" lane
    // starts earning its place instead of repeating a card you can already see.
    document.body.classList.toggle('crowded', c.total > 8);
    const needs = $('needs');
    if (model.needsYou.length) {
      needs.hidden = false;
      $('needs-cards').innerHTML = model.needsYou.map((n) => `
        <div class="need ${n.status === 'done' ? 'done' : ''}" role="button" tabindex="0" data-pane="${esc(n.paneId)}" data-label="${esc(n.label)}" data-cwd="${esc(n.cwd ?? '')}">
          <div class="who">${esc(n.label)}</div>
          <div class="meta">${esc(n.workspaceLabel)}</div>
          <span class="tag ${STATUS[n.status].cls}">${n.status === 'blocked' ? 'Wants input' : STATUS.done.label}</span>
        </div>`).join('');
    } else { needs.hidden = true; }

    const anyAgents = c.total > 0 || model.workspaces.some(w => w.tabs.some(t => t.panes.length));
    if (!anyAgents) {
      $('workspaces').innerHTML = '';
      $('state').innerHTML = emptyState();
      drawLinks();
      return;
    }
    $('workspaces').innerHTML = model.workspaces.map((w) => `
      <section class="ws ${agentsIn(w) >= 3 ? 'busy' : ''}">
        <div class="ws-head">
          ${w.focused ? '<span class="focus-star" title="This workspace is focused in Herdr">★</span>' : ''}
          <h3 title="${esc(w.label)}">${esc(w.label)}</h3>
          <span class="badge">${agentsIn(w) ? `${agentsIn(w)} agent${agentsIn(w) === 1 ? '' : 's'}` : shellsIn(w) ? `${shellsIn(w)} shell${shellsIn(w) === 1 ? '' : 's'}` : 'empty'}</span>
          ${agentsIn(w) ? `<button class="btn"
            data-close-ws="${esc(w.id)}" data-n="${agentsIn(w)}" data-label="${esc(w.label)}"
            >Close ${agentsIn(w)}</button>` : ''}
        </div>
        <div class="tabs">
          ${w.tabs.map((t) => `
            <div class="tab-group">
              <div class="tab-label">${esc(t.label)}</div>
              <div class="panes">${t.panes.map(card).join('')}</div>
            </div>`).join('')}
        </div>
      </section>`).join('');
    drawLinks();          // the cards were just rebuilt, so the lines between them move too
  }

  const emptyState = () => `<div class="state">
    <div class="display">Your workspace is quiet</div>
    <p>Herdr is connected, but no agents are running yet.</p>
    <p class="hint">Open Herdr, type <b>claude</b> in a pane, and this map fills in on its own — no refresh.</p>
  </div>`;

  const errorState = (msg) => `<div class="state">
    <div class="display">Waiting for Herdr</div>
    <p>${esc(msg)}</p>
    <p class="hint">This page keeps trying every ${(pollMs/1000).toFixed(1)}s. The moment Herdr is up, the map appears.</p>
  </div>`;

  const loadingState = () => `<div class="state"><div class="spin"></div><p>Reading your agents…</p></div>`;

  $('state').innerHTML = loadingState();

  async function tick() {
    const data = await get('/api/snapshot');
    if (!data.ok) { setLive(false, 'offline'); renderState(errorState(data.error)); return; }
    setLive(true, 'live');
    render(data.model);
  }

  await tick();
  setInterval(tick, pollMs);
  window.addEventListener('focus', tick);
</script>
</body>
</html>
