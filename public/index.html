<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One-Way-Out</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1 class="display">One-Way-Out</h1>
      <!-- Which company you are looking at. Everything under the nav is that company's. -->
      <label class="co-pick"><span class="sr">Company</span><select id="co-pick" aria-label="Company"></select></label>
    </div>
    <div class="head-right">
      <span class="flow-msg" id="head-msg" role="status" aria-live="polite"></span>
      <!-- The one switch that lets the company act on its own. Off, nothing is sent to any agent. -->
      <button class="btn run-toggle" id="run-toggle" hidden></button>
      <button class="btn" data-help title="What this is, and every key you can press (press ?)">? Help</button>
      <div class="live" id="live"><span class="dot-live"></span><span id="live-text">connecting…</span></div>
    </div>
  </header>

  <div class="shell">
    <nav class="side" aria-label="Pages">
      <a href="#/" data-nav="dashboard" title="What needs you (D)">Dashboard</a>
      <a href="#/issues" data-nav="issues" title="Every piece of work (I)">Issues</a>
      <a href="#/goals" data-nav="goals" title="What the company is aiming at (G)">Goals</a>
      <a href="#/org" data-nav="org" title="Who works here (O)">Org</a>
      <a href="#/routines" data-nav="routines" title="Work that repeats (R)">Routines</a>
      <a href="#/inbox" data-nav="inbox" title="Waiting for your yes or no (B)">Inbox <b class="count" id="inbox-count" hidden></b></a>
      <a href="#/activity" data-nav="activity" title="Everything that happened (L)">Activity</a>
      <span class="side-rule" aria-hidden="true"></span>
      <a href="#/agents" data-nav="agents" title="Every agent running in Herdr (A)">Agents</a>
      <a href="#/settings" data-nav="settings" title="Company, budgets and Herdr's own look">Settings</a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

<script type="module" src="./app.js"></script>
</body>
</html>
